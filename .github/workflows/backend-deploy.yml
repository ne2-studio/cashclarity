name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backend-deploy.yml'
      - '.github/actions/**'
      - 'backend/**'
      - 'scripts/**'
      - 'docker-compose.lite.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ne2-studio/cashclarity-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build/test backend
        run: VERIFY_COVERAGE=1 ./scripts/verify backend

      - name: Build/test coverage report
        uses: ./.github/actions/publish-dotnet-coverage
        with:
          reports: backend/coverage/**/coverage.cobertura.xml
          target-directory: backend/coverage/report
          artifact-name: backend-coverage-report

      - name: Backend persistence tests
        run: ./scripts/verify backend-persistence

      - name: Package backend image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: backend
          cache-scope: backend-api

      - name: Scan backend image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

      - name: Verify packaged backend
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:latest
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build backend-acceptance

      - name: Release backend image
        uses: ./.github/actions/release-ghcr-image
        with:
          image: ${{ env.IMAGE_NAME }}
          context: backend
          cache-scope: backend-api
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        uses: ./.github/actions/deploy-coolify
        with:
          service: backend
          webhook: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          token: ${{ secrets.COOLIFY_API_TOKEN }}
