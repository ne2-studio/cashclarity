name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backend-deploy.yml'
      - 'backend/**'
      - 'scripts/**'
      - 'docker-compose.lite.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ne2-studio/cashclarity-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build/test backend
        run: VERIFY_COVERAGE=1 ./scripts/verify backend

      - name: Backend persistence tests
        run: ./scripts/verify backend-persistence

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest backend

      - name: Verify packaged backend
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:latest
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build backend-acceptance

      - name: Push image
        run: docker push $IMAGE_NAME:latest

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_BACKEND }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
