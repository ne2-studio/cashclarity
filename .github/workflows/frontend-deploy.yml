name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - '.github/actions/**'
      - 'frontend/**'
      - 'backend/CashClarity.Api/**'
      - 'backend/CashClarity.Api.Lite/**'
      - 'scripts/**'
      - 'docker-compose.lite.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ne2-studio/cashclarity-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: frontend

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: frontend
          cache-dependency-path: frontend/package-lock.json

      - name: Build/test frontend
        run: VERIFY_COVERAGE=1 ./scripts/verify frontend

      - name: Build/test coverage report
        uses: ./.github/actions/publish-node-coverage
        with:
          title: Frontend test coverage
          summary-path: frontend/coverage/summary.txt
          artifact-name: frontend-coverage-report
          artifact-path: frontend/coverage

      - name: Build Vite app for image
        working-directory: frontend
        run: npm run build

      - name: Package frontend image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest
          context: frontend
          cache-scope: frontend-app

      - name: Scan frontend image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}:latest

      - name: Package acceptance API image
        uses: ./.github/actions/docker-build-image
        with:
          image: cashclarity-api-lite:ci
          context: backend
          dockerfile: backend/CashClarity.Api.Lite/Dockerfile
          cache-scope: api-lite

      - name: Verify frontend acceptance
        env:
          FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}:latest
          API_LITE_IMAGE: cashclarity-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build frontend-acceptance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Release frontend image
        uses: ./.github/actions/release-ghcr-image
        with:
          image: ${{ env.IMAGE_NAME }}
          context: frontend
          cache-scope: frontend-app
          sha: ${{ github.sha }}
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: frontend-production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend
        uses: ./.github/actions/deploy-coolify
        with:
          service: frontend
          webhook: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
          token: ${{ secrets.COOLIFY_API_TOKEN }}
