name: Frontend CI/CD

# Tests + aceptación en cada cambio; despliegue en Cloudflare Pages (proyecto cashclarity-frontend):
# push a main -> producción (cashclarity-frontend.ne2.studio); PR -> preview en <rama>.cashclarity-frontend.pages.dev.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - '.github/actions/**'
      - 'frontend/**'
      - 'backend/CashClarity.Api/**'
      - 'backend/CashClarity.Api.Lite/**'
      - 'scripts/**'
      - 'docker-compose.lite.yml'
  pull_request:
    paths:
      - '.github/workflows/frontend-deploy.yml'
      - '.github/actions/**'
      - 'frontend/**'
      - 'backend/CashClarity.Api/**'
      - 'backend/CashClarity.Api.Lite/**'
      - 'scripts/**'
      - 'docker-compose.lite.yml'

permissions:
  contents: read

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Imagen local solo para la aceptación (docker-compose.lite.yml); ya no se publica ni se despliega.
  IMAGE_NAME: cashclarity-frontend:ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build/test setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: frontend

      - name: Build/test browser setup
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: frontend
          cache-dependency-path: frontend/package-lock.json

      - name: Build/test frontend
        run: VERIFY_COVERAGE=1 ./scripts/verify frontend

      - name: Build/test coverage report
        uses: ./.github/actions/publish-node-coverage
        with:
          title: Frontend test coverage
          summary-path: frontend/coverage/summary.txt
          artifact-name: frontend-coverage-report
          artifact-path: frontend/coverage

      - name: Build Vite app for acceptance image
        working-directory: frontend
        run: npm run build

      - name: Package acceptance frontend image
        uses: ./.github/actions/docker-build-image
        with:
          image: ${{ env.IMAGE_NAME }}
          context: frontend
          cache-scope: frontend-app

      - name: Package acceptance API image
        uses: ./.github/actions/docker-build-image
        with:
          image: cashclarity-api-lite:ci
          context: backend
          dockerfile: backend/CashClarity.Api.Lite/Dockerfile
          cache-scope: api-lite

      - name: Verify frontend acceptance
        env:
          FRONTEND_IMAGE: ${{ env.IMAGE_NAME }}
          API_LITE_IMAGE: cashclarity-api-lite:ci
          KEEP_VERIFY_IMAGES: "1"
        run: ./scripts/verify --skip-image-build frontend-acceptance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy:
    needs: build
    # Los PRs desde forks no tienen acceso a los secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build setup
        uses: ./.github/actions/setup-node-package
        with:
          working-directory: frontend

      - name: Build Vite app
        working-directory: frontend
        run: npm run build

      # Equivalente a lo que hacía el contenedor nginx al arrancar: en Coolify solo
      # estaba definida VITE_API_URL; el resto quedan vacías.
      - name: Generate runtime env-config.js
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          envsubst '${VITE_API_URL} ${VITE_AUTH_DISABLED} ${VITE_OIDC_AUTHORITY} ${VITE_OIDC_CLIENT_ID} ${VITE_OIDC_CALLBACK_URI} ${VITE_OIDC_LOGOUT_REDIRECT_URI}' \
            < dist/env-config.template.js > dist/env-config.js
          # Sin 404.html Pages sirve index.html en las rutas de la SPA.
          rm -f dist/404.html

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=cashclarity-frontend --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview frontend: $URL"
