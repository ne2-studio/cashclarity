name: Release GHCR image
description: Push an image to GHCR tagged both :latest and :sha-<commit>, reusing the GHA build cache.

inputs:
  image:
    description: Base image ref without a tag.
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Optional Dockerfile path.
    required: false
    default: ""
  cache-scope:
    description: Cache scope key used by the earlier build step.
    required: true
  sha:
    description: Commit SHA to tag the image with.
    required: true
  username:
    description: GHCR username.
    required: true
  token:
    description: GHCR token.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Push image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        tags: |
          ${{ inputs.image }}:latest
          ${{ inputs.image }}:sha-${{ inputs.sha }}
        push: true
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
